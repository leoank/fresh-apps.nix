name: Update Dependencies
on:
  schedule:
    # 01:07 UTC daily, after the US-daytime Signal and WhatsApp releases.
    # GitHub starts scheduled runs hours late (06:00 ran at 13:00-15:00 in
    # 2026-10/11), and neusis bumps this input at 03:17 (run ~11:00), so
    # this must be scheduled well before that for rogue to get the update
    # the same day. Minute 7: the top of the hour is GitHub's busiest.
    - cron: '7 1 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Specific packages to update (space-separated, empty for all)'
        required: false
        default: ''
      inputs:
        description: 'Specific flake inputs to update (space-separated, empty for all)'
        required: false
        default: ''
jobs:
  update:
    uses: ./.github/workflows/update-flake.yml
    with:
      packages: ${{ github.event.inputs.packages }}
      inputs: ${{ github.event.inputs.inputs }}
      pr-labels: 'dependencies,automated'
      auto-merge: true
    secrets:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
  # A failed run opens the issue "fresh-apps: update run failing" and
  # sends the email once; the next good run closes it.
  alert:
    needs: update
    if: always() && contains(fromJSON('["success","failure"]'), needs.update.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          POSTMARK_API_KEY: ${{ secrets.POSTMARK_API_KEY }}
          ALERT_FROM: ghcibot@leoank.me
          ALERT_TO: leoank98@gmail.com
          STATE: ${{ needs.update.result == 'failure' && 'failed' || 'ok' }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .github/ci/alert.sh "$STATE" "fresh-apps: update run failing" "Update Dependencies $STATE: $RUN"
